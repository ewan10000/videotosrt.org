name = "videotosrt-backend"
main = "src/worker.ts"
compatibility_date = "2026-04-30"

[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 0.01
persist = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "videotosrt-db"
database_id = "3a5b095b-3914-443f-b256-365a4d912063"

[[r2_buckets]]
binding = "R2"
bucket_name = "r2tong0607"

[[queues.producers]]
binding = "AI_QUEUE"
queue = "videotosrt-ai-queue"

[[queues.consumers]]
queue = "videotosrt-ai-queue"
max_batch_size = 5
max_batch_timeout = 30
max_retries = 12

[triggers]
crons = ["17 3 * * *"]

[vars]
SITE_NAME = "VideoToSRT"
APP_ORIGIN = "https://videotosrt.org"
AI_PROVIDER = "groq-whisper"
PAYMENT_PROVIDER = "stripe"
R2_ACCOUNT_ID = "b2633e8fad738ca6375e741cf013656d"
R2_BUCKET_NAME = "r2tong0607"
R2_ENDPOINT = "https://b2633e8fad738ca6375e741cf013656d.r2.cloudflarestorage.com"

STRIPE_CREDITS_2H_PRICE_ID = "price_1UOZFCJn7RBkKvX9M8R6GUFZ"
STRIPE_CREDITS_5H_PRICE_ID = "price_1UOZFDJn7RBkKvX9NZPNfRpi"
STRIPE_CREDITS_20H_PRICE_ID = "price_1UOZFDJn7RBkKvX9EJ2yBwyx"
STRIPE_PRO_MONTHLY_PRICE_ID = "price_1UKyrzJn7RBkKvX9f5qkb3vU"
STRIPE_PRO_YEARLY_PRICE_ID = "price_1UKys3Jn7RBkKvX9JlcxDo3s"
STRIPE_STUDIO_MONTHLY_PRICE_ID = "price_1UKys5Jn7RBkKvX9TIktKMWt"
STRIPE_STUDIO_YEARLY_PRICE_ID = "price_1UKys7Jn7RBkKvX9GGCiUgiS"
STRIPE_PORTAL_CONFIGURATION_ID = "bpc_1UKywfJn7RBkKvX9RDVPAgiS"
